name: Build and publish extension release

on:
  workflow_dispatch:
  push:
    paths:
      - "gold-silver-rate/**"
      - "README.md"
      - "CHANGELOG.md"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: echo "tag=v$(python -c "import json; print(json.load(open('gold-silver-rate/manifest.json'))['version'])")" >> "$GITHUB_OUTPUT"
      - name: Verify manifest and JavaScript
        run: |
          python -m json.tool gold-silver-rate/manifest.json >/dev/null
          for file in gold-silver-rate/*.js; do node --check "$file"; done
      - name: Package Chrome and Edge builds
        run: |
          cd gold-silver-rate
          zip -r ../gold-silver-rate-chrome.zip . -x "*.DS_Store"
          cp ../gold-silver-rate-chrome.zip ../gold-silver-rate-edge.zip
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Gold & Silver Rate ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            gold-silver-rate-chrome.zip
            gold-silver-rate-edge.zip
